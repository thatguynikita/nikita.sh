    html += `</div>`;
    html += `<hr class="rule strong">`;

    html += `<div class="section">`;
    html += sectionHead(U.cmdCatAbout, U.fileAbout);
    html += `<p class="body">${U.about}</p>`;
    html += `</div>`;

    html += `<div class="section">`;
    html += sectionHead(U.cmdExperience, U.fileExperience);
    JOBS.forEach(j=>{
      html += `<div class="job">`;
      html += `<div class="job-meta"><span class="dates">${j.dates[lang]}</span> <span class="span">(${j.span[lang]})</span> &rsaquo; <span class="co">${j.co}</span> <span class="loc">${j.loc[lang]}</span></div>`;
      html += `<div class="job-title">${j.title[lang]}</div>`;
      html += `<ul class="bullets">` + j.bullets[lang].map(b=>`<li>${b}</li>`).join('') + `</ul>`;
      html += `<div class="tech">${U.techPrefix} ${j.tech}</div>`;
      html += `</div>`;
    });
    html += `</div>`;

    html += `<div class="section">`;
    html += sectionHead(U.cmdEducation, U.fileEducation);
    html += `<p class="body">${U.educationBody}</p>`;
    html += `</div>`;

    html += `<div class="section">`;
    html += sectionHead(U.cmdCerts, U.fileCerts);
    CERTS.forEach(c=>{
      html += `<div class="cert-row"><span class="ok">[x]</span><span class="yr">${c.yr}</span> ${c.name}</div>`;
    });
    html += `</div>`;

    html += `<div class="section">`;
    html += sectionHead(U.cmdLangs, U.fileLangs);
    LANGUAGES.forEach(l=>{
      html += `<div class="langrow"><span class="lang-label">${l.name[lang]}</span><span class="lang-bar">`;
      for(let i=0;i<10;i++){ html += `<i${i<l.filled?' class="on"':''}></i>`; }
      html += `</span><span class="lang-sub">${l.sub[lang]}</span></div>`;
    });
    html += `</div>`;

    html += `<div class="section">`;
    html += sectionHead(U.cmdSkills, U.fileSkills);
    html += `<table class="tbl">`;
    SKILLS.forEach(s=>{
      html += `<tr><td class="key">${s.key[lang]}</td><td>${s.val}</td></tr>`;
    });
    html += `</table></div>`;

    html += `<div class="section">`;
    html += sectionHead(U.cmdNotes, U.fileNotes);
    html += `<div class="traits">`;
    TRAITS[lang].forEach(tr=>{ html += `<div><span class="hash"># </span>${tr}</div>`; });
    html += `</div></div>`;

    html += `<hr class="rule">`;
    html += `<div class="line sign-off dim">${U.signOff}<span class="fake-cursor" aria-hidden="true"></span></div>`;

    termBody.innerHTML = html;
    document.getElementById('printBtn').textContent = U.print;
    document.getElementById('footerBack').textContent = U.footerBack;
    document.documentElement.lang = lang;
  }

  const langChip = document.getElementById('langChip');
  const langAnnounce = document.getElementById('langAnnounce');
  function updateLangChip(){
    langChip.textContent = UI[lang].langChip;
    langChip.setAttribute('aria-label', UI[lang].langSwitchLabel);
  }
  langChip.addEventListener('click', ()=>{
    lang = lang === 'en' ? 'ru' : 'en';
    updateLangChip();
    render();
    window.NikitaTheme.writeStored(window.NikitaTheme.LANG_STORAGE_KEY, lang);
    if(langAnnounce) langAnnounce.textContent = UI[lang].langAnnounce;
  });

  updateLangChip();
  render();
})();
</script>
</body>
</html>
