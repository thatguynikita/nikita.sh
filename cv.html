  .topbar button{color:var(--fg-dim); text-decoration:none; cursor:pointer; background:none; border:none; font:inherit; letter-spacing:.03em; padding:0;}

    ctx.fillStyle = "rgba(2,4,3,0.08)";

    ctx.font = "15px monospace";
    for(let i=0;i<cols;i++){

      if(drops[i]*15 > canvas.height && Math.random() > 0.975) drops[i] = 0;
